# 诊断规则库 — marketing-audit
#
# enabled=false 的条目为「软下线」：引擎短路跳过（status=disabled），不参与打分、不进报告，
# 但 id 不复用、历史 job 的 state 仍可解释，业务反悔时改回 true 即可。
#
# 字段说明
# --------
# applies_to          : 适用范围（通用 / 广告投放 / 红包提醒·红包发放），对应 Excel「使用范围」列
# scope_filter        : applies_to 的可执行表达式；不匹配时规则 not_applicable（活动类型不适用）
# channel_filter      : 渠道子集过滤（activity_channel_std），在适用行子集上评估
# min_trigger_rate    : 触发率低于该值时不上报（status=below_min_trigger_rate）
# threshold_reference : 只做对照输出、不参与判定的阈值
# recommendations     : 建议方向（业务评审沉淀，methodology/08 的表格由此同步）
# data_note           : 上游数据口径备注，写入报告 data_caveats
# pending_change      : 已评审但受阻于数据的待改动，供后续批次认领
#
# 最近一次业务评审：2026-08-12（《营销诊断项目.xlsx·知识库优化》第 50-84 行）
rules:
- id: 1
  category: 触达质量
  name: 无效营销触达
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - pre_mainflow_event_cnt
  - activity_touch_cnt
  condition_template: (pre_mainflow_event_cnt == 0) & (activity_touch_cnt > 0)
  threshold_fields: []
  handling: row_level
  severity_base: mid
  description: 用户未进入主流程，却有营销触达。说明触达人群与主流程行为完全脱节，无实际转化潜力。
  execution_difficulty: medium
  positive_alias: 无主流程用户成单不低
  recommendations:
  - 优化人群定向，排除低意向用户
  - 检查营销内容与落地页匹配度，确保用户点击后能找到预期内容
- id: 2
  category: 触达质量
  name: 过度营销骚扰
  applies_to: 通用
  enabled: true
  channel_filter: activity_channel_std in ('push', 'popup', 'sms', 'outbound', 'insite_msg')
  required_fields:
  - activity_touch_cnt
  condition_template: activity_touch_cnt >= threshold('activity_touch_cnt', 'optimal')
  threshold_fields:
  - field: activity_touch_cnt
    stat: optimal
  handling: row_level
  severity_base: mid
  description: 当日触达次数过高，超过阈值后 CVR 不再提升甚至下降，属于骚扰性触达。
  execution_difficulty: easy
  data_note: 弹屏存在曝光/点击/关闭三种 action，activity_touch_cnt 与 pre_popup_touch_cnt 应只统计「曝光」；上游大宽表口径修正前，本条对 popup 渠道的触达次数偏高。
  recommendations:
  - 设置营销频次上限控制，单用户单日触达不超过 3 次，避免用户反感
- id: 3
  category: 触达质量
  name: 弹屏打扰
  applies_to: 通用
  enabled: true
  channel_filter: activity_channel_std == 'popup'
  required_fields:
  - activity_channel_std
  - pre_popup_reject_cnt
  condition_template: (activity_channel_std == 'popup') & (pre_popup_reject_cnt > 0)
  threshold_fields: []
  handling: row_level
  severity_base: mid
  description: 弹屏渠道触达且用户历史上有快速拒绝弹屏的记录（10秒内离开），说明该用户对弹屏高度抵触。
  execution_difficulty: medium
  pending_change: P1：条件拟扩为 (activity_channel_std=='popup') & (pre_popup_reject_cnt>0) & ((pre_popup_close_rate>0.6) | (timediff<10))；依赖新派生字段 pre_popup_close_rate（源自 popup 分类中 action='关闭'）。
  recommendations:
  - 优化弹屏触发时机，避免在用户关键操作路径弹出
  - 弹屏内容与用户当前意图匹配
  - 优化弹屏样式
- id: 4
  category: 触达质量
  name: 人群质量过低
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - risk_type
  - finance_revenue_after
  - timediff
  condition_template: (risk_type == '风险用户') | (finance_revenue_after < 0) | (timediff < 10)
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 触达人群中风控风险用户、近1年净营收为负、或当天停留极短（疑似误触/低质量）占比过高，营销资源投在低质量人群上。基于 V2.1 新增用户画像字段（risk_type 风控 / finance_revenue_after 营收 / timediff 停留时长）评估；字段取值（'风险用户' / 营收负值 / 停留秒数）以实际数据为准。久未消费信号（距上次消费>360天）需补充 days_since_last_order 派生字段后再叠加。
  execution_difficulty: easy
  recommendations:
  - 投放人群加上风控标签的过滤
- id: 5
  category: 触达质量
  name: 僵尸用户浪费营销
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - pre_mainflow_event_cnt
  - pre_is_dormant_user
  - pre_total_event_cnt
  - visit_days
  condition_template: (pre_mainflow_event_cnt == 0) & ((pre_is_dormant_user == 1) | (pre_total_event_cnt <= threshold('pre_total_event_cnt', 'optimal'))) & (visit_days <= threshold('visit_days', 'p25'))
  threshold_fields:
  - field: pre_total_event_cnt
    stat: optimal
  - field: visit_days
    stat: p25
  handling: row_level
  severity_base: mid
  description: 近1天无主流程行为、总行为极少，且**近90天访问天数处于最低四分之一** —— 三个条件同时成立才判为沉默用户。特征表是近1天窗口，只看当天会把「今天恰好没动静的正常用户」误判成僵尸；visit_days 是近90天口径，用来承担「长期低活跃」这半边判断。
  execution_difficulty: easy
  positive_alias: 低活跃沉默用户成单较高
  data_note: visit_days 来自画像表（近90天访问天数），若画像未 join 上则本规则整条 skipped —— 这是有意的：宁可不报，也不用一天行为下长期结论。
  recommendations:
  - 建立用户活跃度筛选机制：近90天访问天数处于最低四分之一且当日无主流程行为的，减少营销触达
  - 优先触达近期有活跃行为的高价值用户
- id: 6
  category: 时机匹配
  name: 营销时机不当
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - period_mismatch_flag
  condition_template: period_mismatch_flag == 1
  threshold_fields: []
  handling: row_level
  severity_base: mid
  description: 触达时段与用户历史行为主时段不一致，说明营销在用户非活跃时间推送，效果折扣大。
  execution_difficulty: easy
  positive_alias: 非常规时段触达成单较高
  recommendations:
  - 优先检查先知场景配置，是否实时场景使用离线标签导致场景伪实时
  - 订阅消息实时场景建议配置即时发送
- id: 7
  category: 时机匹配
  name: 成单后推送过急
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - pre_has_complete_order
  - pre_last_order_to_touch_min
  condition_template: (pre_has_complete_order == 1) & (pre_last_order_to_touch_min <= threshold('pre_last_order_to_touch_min', 'optimal'))
  threshold_fields:
  - field: pre_last_order_to_touch_min
    stat: optimal
  handling: row_level
  severity_base: mid
  description: 用户已有历史成单，且最近一次成单到本次触达的间隔短于 CVR 最优切分点，属于成单后过急推送。注意本条只度量「间隔过短」，不校验触达与成单的先后顺序；疑似时序倒置应回到先知实时场景标签配置排查。
  execution_difficulty: easy
  positive_alias: 近期成单复购人群成单较高
  recommendations:
  - 将营销推送时间延后
  - 查看实时场景标签是否配置错误
- id: 11
  category: 内容匹配
  name: 跨品类推送错配
  applies_to: 通用
  enabled: true
  channel_filter: activity_channel_std in ('activity', 'push', 'popup', 'sms', 'outbound', 'insite_msg')
  required_fields:
  - pre_target_product_visit_cnt
  - pre_browse_target_product
  condition_template: (pre_target_product_visit_cnt == 0) & (pre_browse_target_product == 0)
  threshold_fields: []
  handling: row_level
  severity_base: mid
  description: '活动目标品类在用户历史上既无主流程访问、也无任何浏览记录，属于「推从没看过的品类」硬错配。（2026-08-12 起口径由 pre_mkt_product_browse_match==0 的兴趣不符改为目标品类零接触；与 #43 同属内容匹配主题组，#43 为本条中「仍有其他主流程行为」的子集。）'
  execution_difficulty: medium
  positive_alias: 跨品类兴趣用户成单不低
  recommendations:
  - 根据用户实时浏览行为动态调整推送内容
  - 建立用户兴趣标签实时更新机制
- id: 12
  category: 站内外衔接
  name: 站内多渠道品类不一致
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - insite_multi_channel_match_flag
  condition_template: insite_multi_channel_match_flag == 0
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 同一用户当日被站内多种渠道触达但推送品类不一致，多渠道间信息矛盾，用户困惑导致转化下降。
  execution_difficulty: medium
  recommendations:
  - 建立跨渠道品类一致性校验机制，同一用户同日多渠道路由一致品类
  - 设置渠道间品类互斥规则
- id: 13
  category: 站内外衔接
  name: 站内外项目不一致
  applies_to: 通用
  enabled: true
  channel_filter: activity_channel_std == 'ads'
  required_fields:
  - has_ads_touch
  - ads_insite_match_flag
  condition_template: (has_ads_touch == 1) & (ads_insite_match_flag == 0)
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 站外广告推品类与站内承接营销品类不一致，用户进站后看到不同产品，转化中断。
  is_positive_signal: true
  positive_signal_reason: 站内外品类一致的广告投放带来更高CVR，说明品类一致性有正向价值
  execution_difficulty: easy
  positive_alias: 站外引流自主进站成单较高
  recommendations:
  - 当广告进站用户且有项目标识时，站内首页弹屏、站内信等投放一致项目的红包和落地页
- id: 14
  category: 站内外衔接
  name: 站外无站内承接
  applies_to: 通用
  enabled: true
  channel_filter: activity_channel_std == 'ads'
  required_fields:
  - ads_no_insite_flag
  condition_template: ads_no_insite_flag == 1
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 有站外广告触达但广告之后无任何站内营销跟进，广告引流后无承接，转化漏斗断裂。
  is_positive_signal: true
  positive_signal_reason: 仅有站外无站内承接的用户CVR反而更高，说明自主意向更强
  execution_difficulty: medium
  positive_alias: 仅站外触达自主意向强成单较高
  recommendations:
  - 建立站外广告到站内承接的联动机制
  - 用户进站后首屏展示与广告内容相关的落地页或活动
- id: 15
  category: 关键打断
  name: 详情页营销打断
  applies_to: 通用
  enabled: false
  disabled_reason: 业务评审下线（2026-08-12 知识库优化）：详情页停留与营销触达的时间差不足以判定「打断」，误诊率高；业务侧不可执行
  disabled_at: '2026-08-12'
  channel_filter: all
  required_fields:
  - pre_last_mainflow_detail
  - pre_last_mainflow_to_touch_min
  condition_template: (pre_last_mainflow_detail.str.contains('详情', na=False)) & (pre_last_mainflow_to_touch_min <= threshold('pre_last_mainflow_to_touch_min', 'optimal'))
  threshold_fields:
  - field: pre_last_mainflow_to_touch_min
    stat: optimal
  handling: row_level
  severity_base: mid
  description: 用户刚浏览完详情页即被营销触达打断（触达间隔极短），干扰了自然决策流程。
  execution_difficulty: medium
  positive_alias: 详情页后即时触达高成单
  recommendations:
  - 设置详情页营销静默期，用户浏览详情页期间暂停营销触达
  - 等用户离开详情页 5 分钟后再触发营销
- id: 16
  category: 关键打断
  name: 弹屏打断支付
  applies_to: 通用
  enabled: false
  disabled_reason: '业务评审下线（2026-08-12 知识库优化）：与 #39 弹屏打扰填写重叠，且创单未付归因不清'
  disabled_at: '2026-08-12'
  channel_filter: activity_channel_std == 'popup'
  required_fields:
  - activity_channel_std
  - pre_reached_booking
  - pre_create_not_complete
  - pre_popup_reject_cnt
  - is_converted
  condition_template: (activity_channel_std == 'popup') & (pre_reached_booking == 1) & (pre_create_not_complete == 1) & (pre_popup_reject_cnt > 0) & (is_converted == 0)
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 有未付创单的用户被弹屏触达，且历史上弹屏后易快速离开，说明弹屏正在干扰支付流程。
  execution_difficulty: medium
  recommendations:
  - 支付流程期间（创单后 15 分钟内）禁止弹屏
  - 完成支付后再恢复营销触达
- id: 17
  category: 关键打断
  name: 填写页营销打断
  applies_to: 通用
  enabled: false
  disabled_reason: 业务评审下线（2026-08-12 知识库优化）：填写页打断口径依赖 pre_last_mainflow_detail 文本匹配，稳定性差
  disabled_at: '2026-08-12'
  channel_filter: all
  required_fields:
  - pre_last_mainflow_detail
  - pre_last_mainflow_to_touch_min
  condition_template: (pre_last_mainflow_detail.str.contains('填写', na=False)) & (pre_last_mainflow_to_touch_min <= threshold('pre_last_mainflow_to_touch_min', 'optimal'))
  threshold_fields:
  - field: pre_last_mainflow_to_touch_min
    stat: optimal
  handling: row_level
  severity_base: high
  description: 用户刚填写订单即被营销触达打断，填写页是高意图阶段，打断代价最高。
  is_definitional: true
  execution_difficulty: medium
  recommendations:
  - 填写页设置营销静默期，保障用户完成下单流程
  - 用户进入填写页后暂停所有营销触达直到订单完成或超时
- id: 18
  category: 关键打断
  name: 营销干扰支付
  applies_to: 通用
  enabled: false
  disabled_reason: 业务评审下线（2026-08-12 知识库优化）：漏斗倒退归因到营销缺乏时序证据
  disabled_at: '2026-08-12'
  channel_filter: all
  required_fields:
  - pre_funnel_regression_after_mkt
  - pre_create_not_complete
  - is_converted
  condition_template: (pre_funnel_regression_after_mkt > 0) & (pre_create_not_complete == 1) & (is_converted == 0)
  threshold_fields: []
  handling: row_level
  severity_base: high
  description: 有未付创单且历史上营销后漏斗曾倒退，说明营销正在干扰而非促进支付。
  is_definitional: true
  execution_difficulty: medium
  recommendations:
  - 创单未付用户优先促付营销（短信提醒、优惠券），避免其他营销内容打断支付决策
- id: 19
  category: 转化效率
  name: 自然转化营销多余
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - pre_is_marketing_first
  - pre_has_coupon
  - pre_has_mkt_click
  - pre_skip_detail_flag
  - pre_back_to_list_cnt
  - pre_is_cross_category
  - pre_funnel_pages_cnt
  condition_template: (pre_is_marketing_first == 0) & (pre_has_coupon == 0) & (pre_has_mkt_click == 0) & ((pre_skip_detail_flag == 1) | ((pre_back_to_list_cnt == 0) & (pre_is_cross_category == 0) & (pre_funnel_pages_cnt <= 3)))
  threshold_fields: []
  handling: row_level
  severity_base: mid
  description: 多信号交叉验证锁定自然转化型用户：首触点非营销、历史无领券、从未点击营销，且路径直达（跳过详情页 或 不返回列表+不跨品类比价+聚焦≤3个主流程页）。这类用户本就自主成交，营销投入属冗余成本。
  is_positive_signal: true
  positive_signal_reason: 自然转化型用户（自主直达、不依赖营销与优惠）CVR显著高于其余，是应剔除的冗余投放对象
  execution_difficulty: medium
  positive_alias: 自然高意向成单人群
  recommendations:
  - 建议缩小人群投放范围
  - 接入红包补贴价敏人群算法，仅对优惠敏感用户补贴
- id: 20
  category: 转化效率
  name: 过度营销浪费
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - activity_touch_cnt
  - is_converted
  - pre_mkt_trigger_mainflow_cnt
  condition_template: (activity_touch_cnt >= threshold('activity_touch_cnt', 'optimal')) & (is_converted == 0) & (pre_mkt_trigger_mainflow_cnt == 0)
  threshold_fields:
  - field: activity_touch_cnt
    stat: optimal
  handling: row_level
  severity_base: high
  description: 营销频次超过CVR拐点仍无转化，且历史上营销从未触发主流程，属于高频低效的营销浪费。
  is_definitional: true
  execution_difficulty: easy
  recommendations:
  - 设置营销频次上限，单用户单日不超过 3 次
  - 营销后无响应用户加入冷却名单，24 小时内不再触达
- id: 21
  category: 转化效率
  name: 缺少临门一脚优惠
  applies_to: 通用
  enabled: true
  channel_filter: all
  required_fields:
  - pre_create_not_complete
  - pre_has_coupon
  - pre_rp_target_product
  - is_converted
  - serialid_bonus
  condition_template: (pre_create_not_complete == 1) & (pre_has_coupon == 0) & (pre_rp_target_product == 0) & (is_converted == 0) & (serialid_bonus >= threshold('serialid_bonus', 'p75'))
  threshold_fields:
  - field: serialid_bonus
    stat: p75
  handling: row_level
  severity_base: high
  description: 有遗单、当日未领券也未领目标品类红包、且未转化，同时**近1年促销订单占比处于前四分之一**（价格敏感）—— 这批人发券最可能奏效。原口径靠「无任何领券记录」倒推价格敏感，方向本就存疑（不领券也可能是不需要优惠）；特征表又是近1天窗口，「今天没领券」更推不出价格不敏感。现改为：近1天的「今天还没给过优惠」负责判断时机，近1年的 serialid_bonus 负责判断价格敏感度。
  is_definitional: true
  execution_difficulty: medium
  data_note: serialid_bonus 来自画像表（近1年促销订单占比），若画像未 join 上则本规则整条 skipped。
  recommendations:
  - 对价格敏感的遗单用户及时发送专属优惠券或红包
  - 设置创单未付自动发券流程
  - 优化优惠门槛，提高核销率
