  - pre_sms_touch_cnt
  - pre_insite_msg_touch_cnt
  - pre_mainflow_event_cnt
  condition_template: ((pre_popup_touch_cnt + pre_push_touch_cnt + pre_sms_touch_cnt + pre_insite_msg_touch_cnt) >= 3) & (pre_mainflow_event_cnt == 0)
  threshold_fields: []
