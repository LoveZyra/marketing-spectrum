[project]
name = "skillwhet"
version = "0.5.2"
description = "Joint evolution of agent-skill prose and code, behind a zero-LLM gate pyramid"
requires-python = ">=3.11"
dependencies = ["libcst>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
gates = ["ruff>=0.5", "bandit>=1.7", "pyright>=1.1"]
test = ["pytest>=8.0", "pytest-timeout>=2.0"]

[project.scripts]
skillwhet = "skillwhet.cli:main"
whet = "skillwhet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", ".evo", ".bench-work", "*.egg-info"]
