    diagnostic_rules: []
    fallback: 0

  - name: pre_hotel_visit_cnt
    type: count
    dimension: product_preference
    description: 酒店主流程访问次数
    threshold_method: percentile
    threshold_percentiles: [75, 90]
    diagnostic_rules: []
    fallback: 0

  - name: pre_flight_visit_cnt
    type: count
    dimension: product_preference
    description: 机票主流程访问次数
    threshold_method: percentile
    threshold_percentiles: [75, 90]
    diagnostic_rules: []
    fallback: 0

  - name: pre_train_visit_cnt
    type: count
    dimension: product_preference
    description: 火车票主流程访问次数
    threshold_method: percentile
    threshold_percentiles: [75, 90]
    diagnostic_rules: []
    fallback: 0

  - name: pre_scenic_visit_cnt
    type: count
    dimension: product_preference
    description: 景区主流程访问次数
    threshold_method: percentile
    threshold_percentiles: [75, 90]
    diagnostic_rules: []
    fallback: 0

  - name: pre_car_visit_cnt
