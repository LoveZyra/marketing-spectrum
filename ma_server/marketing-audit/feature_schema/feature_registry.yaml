# 特征注册表 — 用户-活动粒度特征宽表
# 数据粒度：mapid + activity_name + activity_id + activity_channel
# 来源文档：features/v3/user_activity_features_v2.md
#
# 字段说明
# --------
# name              : 字段名（与 df 列名完全一致）
# type              : count | rate | ordinal | binary | text | timestamp | category
# dimension         : 所属分析维度（对应 FeatureLoader.fields_for_dimension()）
# description       : 字段含义（中文）
# threshold_method  : percentile | optimal_split | none
#   - percentile    : 按分位数计算阈值（适用于 count/rate/ordinal 类型）
#   - optimal_split : Youden's J 最优切分（需要 is_converted；转化率<1% 降级为 percentile）
#   - none          : binary/text/timestamp 不需要阈值
# threshold_percentiles: 仅 percentile 方法使用，计算哪些分位数
# diagnostic_rules  : 关联的诊断规则 ID（来自 diagnostic_rules.yaml）
# fallback          : 字段缺失时的降级填充值（null 表示不填充，保留 NaN）

features:

  # ─────────────────────────────────────────────────────────
  # 维度 0：活动触达信息（activity_info）
  # ─────────────────────────────────────────────────────────

  - name: mapid
    type: category
    dimension: activity_info
    description: 用户主ID（联合主键之一）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: deviceid
    type: category
    dimension: activity_info
    description: 设备ID
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: unionid
    type: category
    dimension: activity_info
    description: 微信 Union ID
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: activity_name
    type: category
    dimension: activity_info
    description: 活动名称（majorname）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: activity_id
    type: category
    dimension: activity_info
    description: 活动ID（id）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: activity_channel
    type: category
    dimension: activity_info
    description: 推送方式原始值（detailname，如弹屏/Push/短信）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: activity_channel_std
    type: category
    dimension: activity_info
    description: 推送方式标准化（popup/push/sms/ads/insite_msg/activity）
    threshold_method: none
    diagnostic_rules: [3, 35, 39]
    fallback: null

  - name: activity_product_name
    type: category
    dimension: activity_info
    description: 活动投放品类（用于转化标签匹配的 product_name）
    threshold_method: none
    diagnostic_rules: [11, 13]
    fallback: null

  - name: touch_date
    type: timestamp
    dimension: activity_info
    description: 触达日期
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: last_touch_time
    type: timestamp
    dimension: activity_info
    description: 最后一次触达时刻（特征截止点）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: first_touch_time
    type: timestamp
    dimension: activity_info
    description: 首次触达时刻
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: touch_hour
    type: ordinal
    dimension: activity_info
    description: 最后触达的小时（0-23）
    threshold_method: none
    diagnostic_rules: [6]
    fallback: null

  - name: touch_period
    type: category
    dimension: activity_info
    description: 最后触达时段（上午/下午/晚上/深夜）
    threshold_method: none
    diagnostic_rules: [6]
    fallback: null

  - name: activity_touch_cnt
    type: count
    dimension: activity_info
    description: 当日触达该用户的次数（单日数据）
    threshold_method: percentile
    threshold_percentiles: [75, 90, 95]
    diagnostic_rules: [1, 2, 20, 33]
    fallback: 0

  - name: activity_click_cnt
    type: count
    dimension: activity_info
    description: 触达中用户点击次数（action='点击'）
    threshold_method: percentile
    threshold_percentiles: [50, 75, 90]
    diagnostic_rules: []
    fallback: 0

  - name: is_activity_clicked
    type: binary
    dimension: activity_info
    description: 是否有任意点击（0/1）
    threshold_method: none
    diagnostic_rules: []
    fallback: 0

  - name: activity_over_touch_flag
    type: binary
    dimension: activity_info
    description: 当日触达≥5次，疑似过度触达（0/1）
    threshold_method: none
    diagnostic_rules: [2]
    fallback: 0

  # ─────────────────────────────────────────────────────────
  # 维度 1：核心标签（label）
  # ─────────────────────────────────────────────────────────

  - name: is_converted
    type: binary
    dimension: label
    description: 触达当日 product_name 匹配的创单或成单（0/1，目标变量）
    threshold_method: none
    diagnostic_rules: [19, 20, 21, 23, 25, 41]
    fallback: null

  - name: is_paid
    type: binary
    dimension: label
    description: 触达当日 product_name 匹配的成单（0/1，区分创单未付）
    threshold_method: none
    diagnostic_rules: [41]
    fallback: null

  - name: convert_product
    type: category
    dimension: label
    description: 转化的品类名称（NULL 表示未转化）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  - name: convert_time
    type: timestamp
    dimension: label
    description: 首次转化时刻（NULL 表示未转化）
    threshold_method: none
    diagnostic_rules: []
    fallback: null

  # ─────────────────────────────────────────────────────────
  # 维度 2：营销时机匹配（timing）
  # ─────────────────────────────────────────────────────────

  - name: period_mismatch_flag
    type: binary
    dimension: timing
    description: 触达时段与用户历史活跃主时段不一致（0/1）
    threshold_method: none
    diagnostic_rules: [6]
    fallback: 0

  # ─────────────────────────────────────────────────────────
  # 维度 3：触达前决策周期（decision_cycle）
  # ─────────────────────────────────────────────────────────

  - name: pre_first_expose_to_touch_min
    type: count
    dimension: decision_cycle
    description: 触达前首条行为到最后触达时刻的时间差（分钟）
    threshold_method: percentile
    threshold_percentiles: [50, 75, 90, 95]
    diagnostic_rules: []
    fallback: null

  - name: pre_last_mainflow_to_touch_min
    type: count
    dimension: decision_cycle
    description: 最近一次主流程行为到最后触达时刻的时间差（分钟）
    threshold_method: percentile
    threshold_percentiles: [25, 50, 75, 90]
    diagnostic_rules: []
    fallback: null

  - name: pre_last_mkt_to_touch_min
    type: count
    dimension: decision_cycle
    description: 上一次历史营销到本次触达的时间差（分钟）
    threshold_method: percentile
    threshold_percentiles: [25, 50, 75, 90]
    diagnostic_rules: []
    fallback: null

  - name: pre_last_order_to_touch_min
    type: count
    dimension: decision_cycle
    description: 最近历史成单到本次触达的时间差（分钟）
    threshold_method: percentile
    threshold_percentiles: [25, 50, 75, 90]
    diagnostic_rules: [7]
    fallback: null

  # ─────────────────────────────────────────────────────────
  # 维度 4：触达前漏斗（funnel）
  # ─────────────────────────────────────────────────────────

  - name: pre_max_funnel_depth
    type: ordinal
    dimension: funnel
    description: 历史最深漏斗阶段（1=首页 2=列表 3=详情 4=填写 5=支付，跨品类）
    threshold_method: percentile
