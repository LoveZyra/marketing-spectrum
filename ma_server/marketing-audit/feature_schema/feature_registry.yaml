    diagnostic_rules: []
    fallback: 0

  - name: pre_min_mkt_response_sec
    type: count
    dimension: pre_marketing
    description: 历史最短营销响应时间（秒），NULL 表示从未响应
    threshold_method: percentile
    threshold_percentiles: [25, 50, 75, 90]
    diagnostic_rules: []
    fallback: null

  - name: pre_unique_activity_cnt
    type: count
    dimension: pre_marketing
    description: 触达前被触达的不同历史活动数
    threshold_method: percentile
    threshold_percentiles: [50, 75, 90]
    diagnostic_rules: [38]
