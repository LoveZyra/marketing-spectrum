  - name: pre_mkt_touched_target_product
    type: binary
    dimension: pre_marketing
    description: 历史上是否有推过同一 product_name 的营销（0/1）
    threshold_method: none
    diagnostic_rules: []
    fallback: 0

  # ─────────────────────────────────────────────────────────
  # 维度 6：触达前产品偏好（product_preference）
  # ─────────────────────────────────────────────────────────

  - name: pre_browse_hotel
    type: binary
    dimension: product_preference
    description: 是否有酒店历史主流程浏览（0/1）
