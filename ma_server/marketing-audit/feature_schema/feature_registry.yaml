    fallback: 0

  - name: pre_touched_ads
    type: binary
    dimension: pre_marketing
    description: 历史是否有广告触达（0/1）
    threshold_method: none
    diagnostic_rules: []
    fallback: 0

  - name: pre_touched_insite_msg
    type: binary
    dimension: pre_marketing
    description: 历史是否有站内信触达（0/1）
    threshold_method: none
    diagnostic_rules: []
    fallback: 0

  - name: pre_touched_activity
    type: binary
    dimension: pre_marketing
    description: 历史是否有活动营销触达（0/1）
    threshold_method: none
    diagnostic_rules: []
    fallback: 0

  - name: pre_popup_touch_cnt
    type: count
    dimension: pre_marketing
    description: 历史弹屏触达次数
