# Prism — Nginx subpath deployment template.
#
# Purpose:
#   Serve Prism from a path prefix such as:
#     http://localhost/ai/
#     https://example.com/ai/
#
# Prism itself still runs at the root of its own HTTP server, for example:
#     http://127.0.0.1:8080/
#
# Nginx receives public requests under /ai, strips that prefix, and forwards the
# remaining path to Prism. For example:
#     /ai/                  ->  /
#     /ai/session/abc       ->  /session/abc
#     /ai/assets/index.js   ->  /assets/index.js
#
# Important Nginx limitation:
#   Nginx does not allow variables in `location` matchers or `rewrite` regexes.
#   The configurable variables below are still useful for proxy/filter values,
#   but if you change /ai to a different subpath, also update every line marked:
#     [SUBPATH LITERAL]
#
# To use a different subpath, replace these literal matchers:
#     location = /ai
#     location ^~ /ai/
#     rewrite ^/ai(?<prism_path>/.*)$ ...
#
# Recommended deployment shape:
#   Prism is the only app using /ai, while the root paths /api, /ws and /shell
#   are also proxied because the frontend still calls those endpoints with
#   root-relative URLs.
#
# Set PRISM_TRUST_PROXY=1 in Prism's environment when you use this file.
#   Without it the rate limiters and the login lockout see this proxy's IP for
#   every request and put all clients in one shared bucket, so one noisy client
#   can lock out everybody. Set it ONLY when a proxy you control is actually in
#   front — a directly reachable server with it set lets any client forge
#   X-Forwarded-For and hand itself a fresh bucket per request.

worker_processes 1;

events {
    # Maximum simultaneous connections handled by each worker process.
    # The default is enough for local testing and small self-hosted deployments.
    worker_connections 1024;
}

http {
    # WebSocket requests include an Upgrade header. Normal HTTP requests do not.
    # This map gives us the right Connection header for both cases:
    #   Upgrade present -> "upgrade"
    #   Upgrade absent  -> "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # For HTTPS deployments, replace this with `listen 443 ssl http2;` and
        # add ssl_certificate / ssl_certificate_key lines.
        listen 80 default_server;

        # Use your real hostname in production, for example:
        #   server_name prism.example.com;
        server_name localhost 127.0.0.1;

        # ---- User settings -------------------------------------------------
        #
        # Public path prefix where users access Prism.
        # Do not add a trailing slash.
        #
        # This variable can be used in redirects and response rewrites. It
        # cannot be used in `location` matchers, so update the [SUBPATH LITERAL]
        # lines too if you change it.
        set $prism_subpath /ai;

        # Private upstream URL where the Prism server is listening.
        # For a default local server this is usually http://127.0.0.1:8080.
        set $prism_upstream http://127.0.0.1:8080;

        # Allow larger file uploads through the code editor/project file APIs.
        #
        # Prism chunks anything above PRISM_LAND_CHUNK_MB / PRISM_UPLOAD_CHUNK_MB
        # (both default 15), so uploads get through even when this is small —
        # every chunk is its own request. Raise it anyway if you want the
        # single-request path used for mid-size files: /api/documents/land
        # accepts up to 500 MB, the Files panel up to 2 GB.
        client_max_body_size 200m;

        # Stream large request bodies straight to Prism instead of spooling
        # them to the proxy's disk first. Without this a big upload is written
        # to /var/lib/nginx twice before Prism sees a byte of it.
        proxy_request_buffering off;

        # Redirect /ai to /ai/ so relative browser URL resolution is stable.
        # [SUBPATH LITERAL] Change `/ai` if you change $prism_subpath.
        location = /ai {
            return 301 $prism_subpath/;
        }

        # Main prefixed Prism UI route.
        #
        # [SUBPATH LITERAL] Change `/ai/` and the `^/ai` rewrite if you change
        # $prism_subpath.
        location ^~ /ai/ {
            # Strip the public subpath before proxying. Prism expects to see
            # root paths such as /, /session/:id, /assets/...
            rewrite ^/ai(?<prism_path>/.*)$ $prism_path break;

            # Forward the rewritten request to the private Prism server.
            proxy_pass $prism_upstream;

            # Use HTTP/1.1 so WebSocket upgrade requests can pass through if a
            # browser reaches a socket endpoint under the subpath.
            proxy_http_version 1.1;

            # Preserve useful request metadata for logs and future app support.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $prism_subpath;

            # WebSocket upgrade headers. Harmless for normal HTTP requests.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Long-running agent and terminal sessions can stay open for a long
            # time, so avoid closing idle proxied connections too aggressively.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable gzip from the upstream response so sub_filter can inspect
            # and rewrite HTML/JS response bodies.
            #
            # This defeats Prism's own `compression()` middleware for
            # everything under the subpath — sub_filter cannot rewrite bytes it
            # cannot read, so the trade is forced. Re-compress here instead, or
            # the JS bundle reaches the browser raw. (/api/ below does NOT
            # strip Accept-Encoding, so API responses stay compressed by Prism.)
            proxy_set_header Accept-Encoding "";
            gzip on;
            gzip_proxied any;
            gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
            gzip_min_length 1024;

            # Rewrite browser-visible root-relative URLs so the runtime can
            # discover that the app is mounted under the subpath.
            #
            # Examples:
            #   href="/favicon.svg"   -> href="/ai/favicon.svg"
            #   src="/assets/app.js"  -> src="/ai/assets/app.js"
            #
            # src/App.tsx reads exactly these tags back out of the DOM to derive
            # the React Router basename, so dropping these filters gives a blank
            # page after login rather than a merely cosmetic asset 404.
            sub_filter_once off;
            sub_filter_types
                application/json
                application/manifest+json
                application/javascript
                text/javascript;

            sub_filter 'href="/' 'href="$prism_subpath/';
            sub_filter 'src="/' 'src="$prism_subpath/';
        }

        # Root API proxy.
        #
        # The Prism frontend calls APIs with root-relative URLs such as
        # /api/auth/login. Keep this location unless the frontend becomes fully
        # prefix-aware for API requests.
        #
        # This also carries GET /api/ready, the readiness probe, and passes the
        # x-prism-api-key header through untouched when PRISM_API_KEY is set.
        location ^~ /api/ {
            proxy_pass $prism_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $prism_subpath;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Main app WebSocket proxy.
        #
        # The frontend opens /ws for realtime chat/session/task updates.
        location /ws {
            proxy_pass $prism_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $prism_subpath;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Shell WebSocket proxy.
        #
        # The browser terminal uses /shell. It requires the same WebSocket
        # upgrade handling as /ws.
        location /shell {
            proxy_pass $prism_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $prism_subpath;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Optional health endpoint proxy, for smoke tests and uptime monitors.
        # Liveness only — see /api/ready above for the probe that also checks
        # the database.
        location = /health {
            proxy_pass $prism_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $prism_subpath;
        }
    }
}
